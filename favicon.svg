<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#0b0f19"/>
  <!-- 4-Leaf Math Operator Clover Emblem -->
  <!-- Leaf Outlines -->
  <g fill="#0b0f19" stroke="#22c55e" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="32" cy="20" r="11"/>
    <circle cx="20" cy="32" r="11"/>
    <circle cx="44" cy="32" r="11"/>
    <circle cx="32" cy="44" r="11"/>
  </g>
  <!-- Math Operator Symbols -->
  <g fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="20">+</text>
    <text x="20" y="32">×</text>
    <text x="44" y="31.5">−</text>
    <text x="32" y="44">÷</text>
  </g>
</svg>
